- id: llm-pi-ai
  config:
    providers:
      openai-codex:
        displayName: OpenAI Codex (ChatGPT subscription)
        # カタログの OAuth 認証とモデル一覧を利用する。API キーは指定しない。
      opencode-go:
        displayName: OpenCode Go
        apiKeyEnv: OPENCODE_GO_API_KEY
        # pi-ai のカタログにある各モデルの API 形式と接続先を利用する。
        models:
          - id: minimax-m3
          - id: glm-5.3-flash
          - id: glm-5.3
          - id: kimi-k3
          - id: deepseek-v4-flash
      ollama-cloud:
        displayName: Ollama Cloud (local proxy)
        api: openai-completions
        baseURL: http://localhost:11434/v1
        apiKeyEnv: DSH_OLLAMA_API_KEY
        compat:
          supportsStore: false
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: glm-5.3-flash:cloud
          - id: glm-5.3:cloud
          - id: deepseek-v4.1-flash:cloud
          - id: minimax-m3:cloud
          - id: kimi-k3:cloud
      tensorfold:
        displayName: TensorFold (DGX Spark x4)
        api: openai-completions
        baseURL: http://10.0.1.60:8000/v1
        # 鍵は不要だが SDK が値を要求するため、起動スクリプトで仮の値を入れる。
        apiKeyEnv: DSH_TENSORFOLD_API_KEY
        # 出力の上限 32,768 と入力の文字のみは pi-ai の既定値と同じ。
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash 1017
            contextWindow: 1048576
            # 既定は考えない。/effort で reasoning_effort に送る値を選ぶ。
            reasoningEfforts:
              "off": none
              low: low
              medium: medium
              high: high
              max: max

- id: agent-default-model
  config:
    provider: opencode-go
    model: minimax-m3
