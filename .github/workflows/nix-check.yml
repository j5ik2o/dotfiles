name: nix-check

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  id-token: write

jobs:
  # squash マージでは PR タイトルがそのままサブジェクトになる。
  # 検証するのはこれから入る 1 件だけで、過去のコミットは対象にしない。
  commit-subject:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check that the PR title names the cause
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: make commit-subject-check

  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Run flake check
        run: make check

      - name: Run lint gates
        run: make lint
