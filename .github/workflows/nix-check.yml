name: nix-check

on:
  pull_request:
    # 本文だけの編集でも、最新の実行に必須チェックを発行する。
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  id-token: write

jobs:
  pr-test-merge:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve and verify the PR test merge
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { number, base, head } = context.payload.pull_request ?? {};
            const isSha = (value) => typeof value === 'string' && /^[a-f0-9]{40}$/.test(value);
            if (!Number.isSafeInteger(number) || number < 1 || !isSha(base?.sha) || !isSha(head?.sha)) {
              return core.setFailed('Missing PR number, base SHA or head SHA');
            }
            core.info(`Expected event parents: ${base.sha} ${head.sha}`);

            // A base edit can launch this run before GitHub refreshes refs/pull/N/merge.
            for (let attempt = 1; attempt <= 6; attempt++) {
              try {
                const { data: ref } = await github.rest.git.getRef({
                  ...context.repo,
                  ref: `pull/${number}/merge`,
                });
                if (ref.object?.type === 'commit' && isSha(ref.object.sha)) {
                  const { data: merge } = await github.rest.git.getCommit({
                    ...context.repo,
                    commit_sha: ref.object.sha,
                  });
                  const parents = merge.parents?.map((parent) => parent.sha) ?? [];
                  core.info(`Merge candidate: ${merge.sha} (${parents.join(' ')})`);
                  if (merge.sha === ref.object.sha && parents.length === 2 &&
                      parents[0] === base.sha && parents[1] === head.sha) {
                    return core.setOutput('sha', merge.sha);
                  }
                }
              } catch (error) {
                if (![404, 409, 422].includes(error.status)) throw error;
                core.info(`Merge ref unavailable (HTTP ${error.status})`);
              }
              if (attempt < 6) await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            core.setFailed('No test merge matched the event base and head SHAs');

  # 検証するのはこれから入る 1 件だけで、過去のコミットは対象にしない。
  commit-subject:
    needs: pr-test-merge
    if: ${{ needs.pr-test-merge.outputs.sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 1 コミットの PR ではコミットの主題が入るので、その履歴も要る。
      - name: Checkout the verified test merge
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.pr-test-merge.outputs.sha }}
          fetch-depth: 0

      - name: Show checkout SHA and parents
        run: git show --no-patch --format='%H %P' HEAD

      - name: Check the PR title and the single commit subject
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_REF: ${{ github.base_ref == 'main' && github.event.pull_request.base.sha || 'origin/main' }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: make commit-subject-check-pr

  flake-check:
    needs: pr-test-merge
    if: >-
      ${{ !cancelled() && (github.event_name == 'push' ||
      (needs.pr-test-merge.result == 'success' && needs.pr-test-merge.outputs.sha != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.pr-test-merge.outputs.sha || github.sha }}
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - name: Show checkout SHA and parents
        if: github.event_name == 'pull_request'
        run: git show --no-patch --format='%H %P' HEAD

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check formatting
        run: make format-check

      - name: Run flake check
        run: make check

      # ローカルでしか走らないゲートはゲートではないので、make done と同じ順で回す。
      # 外部コマンドはすべて PATH の偽物で差し替わるため Linux でも動く。
      - name: Run activation tests
        run: make test-activation

      - name: Run lint gates
        run: make lint

      # aislop の検査は node と npm ci が要る。node の版は config/mise/mise.toml を
      # 正本にするため、mise を setup して config/mise から node を導入する（版を直書きしない）。
      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Trust mise config
        run: mise trust --yes config/mise/mise.toml

      - name: Install node
        run: mise install node --cd config/mise

      # install は node を置くだけで PATH を足さない。config/mise の bin を
      # 後続 step へ引き継ぎ、runner 既定の Node で動かないようにする。
      # stderr には trust の WARN が出るので捨て、空なら静かに進まず失敗させる。
      - name: Add mise node to PATH
        run: bash scripts/nix-check-setup-node-path.sh

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      # PATH の Node が config/mise/mise.toml の版と一致することをログと終了コードで示す。
      - name: Show node version
        run: bash scripts/nix-check-assert-node-version.sh

      - name: Run aislop check
        run: npm run check:aislop

  required-pr-ci:
    # 対象外の skipped が必須チェックと同じ名前で報告されないようにする。
    name: >-
      ${{ github.event_name == 'pull_request' && github.base_ref == 'main' &&
      'Required PR CI' || 'PR CI gate (outside scope)' }}
    # 依存ジョブが失敗・キャンセル・スキップしてもゲートを評価する。
    if: ${{ always() && github.event_name == 'pull_request' && github.base_ref == 'main' }}
    needs: [pr-test-merge, commit-subject, flake-check]
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the test merge and both checks to succeed
        if: ${{ always() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GATE_STATUS: ${{ job.status }}
          PR_TEST_MERGE_RESULT: ${{ needs.pr-test-merge.result }}
          COMMIT_SUBJECT_RESULT: ${{ needs.commit-subject.result }}
          FLAKE_CHECK_RESULT: ${{ needs.flake-check.result }}
        with:
          script: |
            const results = {
              gate: process.env.GATE_STATUS ?? 'missing',
              'pr-test-merge': process.env.PR_TEST_MERGE_RESULT ?? 'missing',
              'commit-subject': process.env.COMMIT_SUBJECT_RESULT ?? 'missing',
              'flake-check': process.env.FLAKE_CHECK_RESULT ?? 'missing',
            };
            core.info(JSON.stringify(results));
            if (Object.values(results).some((result) => result !== 'success')) {
              core.setFailed('The test merge, both required checks, and the gate must succeed');
            }
