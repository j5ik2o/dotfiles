name: nix-check

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  id-token: write

jobs:
  # 検証するのはこれから入る 1 件だけで、過去のコミットは対象にしない。
  commit-subject:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 1 コミットの PR ではコミットの主題が入るので、その履歴も要る。
      - name: Checkout the pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check the PR title and the single commit subject
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: make commit-subject-check-pr

  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Run flake check
        run: make check

      - name: Run lint gates
        run: make lint
