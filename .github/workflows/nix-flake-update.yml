name: nix-flake-update

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * 0"

permissions:
  contents: write

concurrency:
  group: nix-flake-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 手動起動でも、更新は既定の枝の上に作る。
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Update flake inputs
        run: make update

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git User
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add -A
          git commit -m "chore(nix): update flake inputs"

      # main は必須チェックで守られていて直接 push できないので、枝に載せて PR にする。
      # PAT で作るのは、GITHUB_TOKEN で作った PR では pull_request の CI が起動しないため。
      - name: Open or update the pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          ./scripts/publish-update-pr.sh automation/nix-flake-update "${BASE}" "chore(nix): update flake inputs"
